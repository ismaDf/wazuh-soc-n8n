<!--
  Configuración EDR para el grupo "linux" (lnx-01 y rhel-01).
  Destino en el manager: /var/ossec/etc/shared/linux/agent.conf
  Validar con: /var/ossec/bin/verify-agent-conf
-->
<agent_config os="Linux">

  <!-- auditd: comandos ejecutados como root (regla oficial 80792) -->
  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <syscheck>
    <!-- whodata: además del cambio, registra QUIÉN y CON QUÉ PROCESO lo hizo (usa auditd) -->

    <!-- Archivos de cuentas y privilegios -->
    <directories whodata="yes" report_changes="yes">/etc/passwd,/etc/group,/etc/sudoers</directories>
    <directories whodata="yes">/etc/shadow</directories>
    <directories whodata="yes" report_changes="yes">/etc/sudoers.d</directories>

    <!-- Persistencia por cron -->
    <directories whodata="yes" report_changes="yes">/etc/crontab,/etc/cron.d,/var/spool/cron</directories>

    <!-- Persistencia por SSH y servicios -->
    <directories whodata="yes" report_changes="yes">/root/.ssh</directories>
    <directories whodata="yes">/etc/systemd/system</directories>

    <!-- Carpetas de descarga: insumo para VirusTotal (UC-03) -->
    <directories realtime="yes">/tmp/descargas-lab</directories>
    <directories realtime="yes">/root/Downloads</directories>
  </syscheck>

</agent_config>
