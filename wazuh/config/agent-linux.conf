<!--
  Configuración centralizada para agentes Linux (Ubuntu/Debian y Red Hat).
  Copiar dentro de /var/ossec/etc/shared/default/agent.conf en el manager.
-->
<agent_config os="Linux">

  <syscheck>
    <!-- Archivos de cuentas y privilegios -->
    <directories realtime="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/group,/etc/sudoers</directories>
    <directories realtime="yes" report_changes="yes">/etc/sudoers.d</directories>

    <!-- Persistencia por cron -->
    <directories realtime="yes" report_changes="yes">/etc/crontab,/etc/cron.d,/var/spool/cron</directories>

    <!-- Persistencia por SSH y servicios -->
    <directories realtime="yes">/root/.ssh</directories>
    <directories realtime="yes">/etc/systemd/system</directories>

    <!-- Carpetas de descarga: insumo para VirusTotal (UC-03) -->
    <directories realtime="yes">/tmp/descargas-lab</directories>
    <directories realtime="yes">/root/Downloads</directories>
  </syscheck>

</agent_config>
