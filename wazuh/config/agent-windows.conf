<!--
  Configuración centralizada para agentes Windows.
  Copiar dentro de /var/ossec/etc/shared/default/agent.conf en el manager.
  Validar con: /var/ossec/bin/verify-agent-conf
-->
<agent_config os="Windows">

  <!-- Seguridad: logons, cuentas, grupos, borrado de logs (1102) -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- System: incluye 104 (borrado de logs de System) -->
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Sysmon (si está instalado; en Win7 se ignora si no existe el canal) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell 5.1: 4103/4104 (Windows Server 2019) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- FIM: carpetas típicas de descarga y persistencia -->
  <syscheck>
    <directories realtime="yes">C:\Users\Public</directories>
    <directories realtime="yes">C:\Windows\Temp</directories>
    <directories realtime="yes">%PROGRAMDATA%\Microsoft\Windows\Start Menu\Programs\Startup</directories>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
  </syscheck>

</agent_config>
